<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>マルチタブ</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script>
        $(function() {
            $("#js-tab li").click(function() {
                $("#js-tab li").removeClass("active");
                $(this).addClass("active");
                var index = $(this).index();

                $(".tab-content").removeClass("active");
                $(".tab-content").eq(index).addClass("active");
            });
        });

    </script>
    <style>
        ul {
            margin: 0;
            padding: 0;
            list-style-type: none;
        }

        p {
            margin: 0;
        }

        .wrap-tab {
            overflow: hidden;
        }

        .list-tab {
            display: flex;
            margin: 0 -2px;
            border-bottom: 3px solid #5bbee5;
        }

        .list-tab>li {
            display: block;
            padding: 0.5em 1em;
            margin: 0 2px;
            width: 100%;
            color: #fff;
            text-align: center;
            background: #ccc;
            box-sizing: border-box;
            cursor: pointer;
        }

        .list-tab .active {
            background: #5bbee5;
        }

        .tab-content {
            display: none;
            padding: 1em;
            border-bottom: 1px solid #5bbee5;
            border-left: 1px solid #5bbee5;
            border-right: 1px solid #5bbee5;
        }

        .tab-content.active {
            display: block;
        }

    </style>


</head>

<body>


    <div class="wrap-tab">
        <ul id="js-tab" class="list-tab">
            <li class="active">Chinese</li>
            <li>English</li>
            <li>vietnam</li>
            <li>Japnese</li>
        </ul>

        <div class="wrap-tab-content">
            <div class="tab-content active">
                <img src="img/ch.png">
            </div>

            <div class="tab-content">
                <img src="img/en.png">
            </div>

            <div class="tab-content">
                <img src="img/vi.png">
            </div>

            <div class="tab-content">
                <img src="img/jp.png">
            </div>
        </div>
    </div>




</body>

</html>
