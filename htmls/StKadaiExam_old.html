<script language="JavaScript" type="text/JavaScript">

        $(function() {
             $('.tab-btn').on('click', function() {
            	var tabWrap = $(this).parents('.wrap-tab');
            	
            	var tabBtn = tabWrap.find(".tab-btn");
            	var tabContent = tabWrap.find('.tab-content');
            	
            	tabBtn.removeClass('active');
                $(this).addClass("active");
                
                tabContent.removeClass('active');
                var index = tabBtn.index(this);
                tabContent.eq(index).addClass('active');
            });
        });


function init(){
	MM_preloadImages('/pc/images/enda-2.gif','/pc/images/sendx-2.gif');
	chk = %_timeLimit%;
	if(chk > 0){
    	countdown();
	}
}
function countdown(){
	term	= %_timeLimit%  * 1000;
	chday	= new Date(%_clock%);
	nday	= new Date();
	seconds = ( chday.getTime() - nday.getTime() + term ) / 1000;

	if(seconds >= 0){
		var minString = Math.floor(seconds / 60);
    	if(minString < 10){ minString = "0" + minString; }		
		
    	var secString = Math.round(seconds %_PERCENT_% 60);
    	if(secString < 10){ secString = "0" + secString; }
		
		document.form1._timer.value = minString +":" + secString; 
		setTimeout("countdown()",1000);
	}else{
		document.form1._timer.value = "Over";
		setsubmit('END');
	}
}

function setsubmit(sw) {
	document.form1._menu.value = sw; // SAVE  END
	document.form1.submit();
}

function Jump(url) 
{
  if (url != '')
  {
    window.open(url, '_blank',"width=400,height=700,left=5,top=5,scrollbars=yes,");
  }
}


function MM_preloadImages() { //v3.0
  var d=document; if(d.images){ if(!d.MM_p) d.MM_p=new Array();
    var i,j=d.MM_p.length,a=MM_preloadImages.arguments; for(i=0; i<a.length; i++)
    if (a[i].indexOf("#")!=0){ d.MM_p[j]=new Image; d.MM_p[j++].src=a[i];}}
}

</script>
