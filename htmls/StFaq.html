<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>採点一覧表</title>
<link href="/pc/css/mycss.css" rel="stylesheet" type="text/css">
<script language="JavaScript" type="text/JavaScript">
<!--



function setSubmit(sw) {
	document.form1._menu.value = sw; // 
	document.form1.submit();
}
function Jump(url) 
{
  if (url != '')
  {
    window.open(url, '_blank',"width=450,height=400,left=5,top=5,scrollbars=yes,");
  }
}
function JumpCL(url) 
{
  if (url != '')
  {
    window.open(url, '_blank',"width=180,height=560,left=5,top=5,scrollbars=no,");
  }
}

function MM_preloadImages() { //v3.0
  var d=document; if(d.images){ if(!d.MM_p) d.MM_p=new Array();
    var i,j=d.MM_p.length,a=MM_preloadImages.arguments; for(i=0; i<a.length; i++)
    if (a[i].indexOf("#")!=0){ d.MM_p[j]=new Image; d.MM_p[j++].src=a[i];}}
}

<style>
a {
   color: #006600;

}

<body>

    <tr> 
      <td height="17" colspan="5" valign="top"><a name="top"></a>&nbsp;</td>
    </tr>
    <tr> 
      <td width="15" rowspan="2" valign="top"><!--DWLayoutEmptyCell-->&nbsp;</td>
      <td width="500" height="34" valign="top"><img src="/pc/images/logo/%_szDB%.gif"></td>
      <td colspan="2" rowspan="2" align="right" valign="top"><a href="#" onClick="setSubmit('RETURN')"><img src="/pc/images/returnIcon.gif" width="32" height="38" border="0"></a></td>
      <td width="40" rowspan="2" valign="bottom"><!--DWLayoutEmptyCell-->&nbsp;</td>
    </tr>
    <tr> 
      <td height="9" valign="top"><img src="/pc/images/spacer.gif" width="100" height="9"></td>
    </tr>
    <tr> 
      <td height="11" colspan="5" valign="top"><img src="/pc/images/logo/logoline4.gif" width="780" height="11"></td>

    <tr>
      <td height="1"></td>

      <td  width="33" align="center" valign="middle" bgcolor="#6699CC" class="mormalWhite14"><!--DWLayoutEmptyCell-->&nbsp;</td>
    <td  width="699" valign="middle" bgcolor="#6699CC"><span class="normalyellow14">%_title%</span><img src="/pc/images/spacer.gif" width="10" height="10"></td>
    <td  width="23" valign="top"><!--DWLayoutEmptyCell-->&nbsp;</td>
  </tr>
  <tr> 
    <td height="10" colspan="4" valign="top"><img src="/pc/images/spacer.gif" width="10" height="10"></td>

    <td><img src="/pc/images/spacer.gif" alt="" width="699" height="1"></td>
    <td><img src="/pc/images/spacer.gif" alt="" width="23" height="1"></td>
  </tr>
</table>

  <table width="780" border="0" cellpadding="0" cellspacing="0">

<pct: @faq_list>

      <td width="532" align="left" valign="middle" class="greenB12Wide"><a href="#a_%_faq_n%">%_$faq_title%</a></td>
      <td colspan="2" align="right" valign="top"><!--DWLayoutEmptyCell-->&nbsp;</td>
      <td colspan="2" valign="top"><!--DWLayoutEmptyCell-->&nbsp;</td>
    </tr>
<pct: /block>
    <tr> 
      <td height="5" colspan="9" valign="top" class="mormalBlue12"><img src="/pc/images/spacer.gif" width="10" height="5"></td>

    <tr>

    </tr>
    <tr> 
      <td height="5" colspan="9" valign="top" class="mormalBlue12"><img src="/pc/images/spacer.gif" width="10" height="5"></td>
    </tr>
    <tr>
