function setsubmit(sw) {
	document.form1._menu.value = sw; // CREATE TERM
	document.form1.submit();
}
function setOrder(num){
	document.form1._menu.value      		= 	"ORDER";
	document.form1._past_kadai_seq.value	=	num;		
	document.form1.submit();
	// 番号は _kadai_seqNum にある	
}
function setAssign(){
	document.form1._menu.value      = "ASSIGN"
	document.form1.submit();
	// 0/1 は _assign にある	
}
function submitEdit(key,num){
	document.form1._menu.value   			= "EDIT"; 
	document.form1._kadai_key.value			= key;
	document.form1._past_kadai_seq.value	= num;
	document.form1.submit();
	// 
}

function submitDelete(key,num){
	if(confirm("★この課題を削除しますか？")){
		document.form1._menu.value 				= 'DELETE'; 
		document.form1._kadai_key.value			= key;
		document.form1._past_kadai_seq.value	= num;		
		document.form1.submit();
	}else{
		return false;
	}
}

function Jump(url) 
{
  if (url != '')
  {
    window.open(url, '_blank',"width=450,height=700,left=5,top=5,scrollbars=yes,");
  }
}
function JumpCL(url) 
{
  if (url != '')
  {
    window.open(url, '_blank',"width=180,height=560,left=5,top=5,scrollbars=no,");
  }
}
function MM_preloadImages() { //v3.0
  var d=document; if(d.images){ if(!d.MM_p) d.MM_p=new Array();
    var i,j=d.MM_p.length,a=MM_preloadImages.arguments; for(i=0; i<a.length; i++)
    if (a[i].indexOf("#")!=0){ d.MM_p[j]=new Image; d.MM_p[j++].src=a[i];}}
}
