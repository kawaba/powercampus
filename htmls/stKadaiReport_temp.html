function	triming(str){
	n	=	str.length;
	for(i=n-1; i>=0; i--){
		ch	=	str.charAt(i);
		if((ch!=" ")&&(ch!="　")){
			return	str.substring(0,i+1);
		}
	}
	return	"";
}
////////　直接編集　///////////
function	putStack(str){
	tagStack.push(str);
	tags	=	tags + 1; 
}
function	popStack(){
	tags	=	tags - 1;
	return	tagStack.pop();
}
function	closeTag(){
	if(tags	== 0) return;
	edit	=	document.form1._answer.value;
	document.form1._answer.value	=	putTag(edit, popStack());
	document.form1._answer.focus();

}
function	closeAllTags(){
	if(tags	== 0) return;
	tagStr	=	"";
	n	=	tags;
	for(i=0; i<n; i++){
		tagStr	=	tagStr	+	popStack();
	}
	edit	=	document.form1._answer.value;
	document.form1._answer.value	=	putTag(edit, tagStr);
	document.form1._answer.focus();

}

// タグマーカーの位置にタグ文字を挿入する
function	putTag(text, tagStr){
	if(tagmarker==""){
		return	text + tagStr;
	}
	position	=	text.indexOf(tagmarker);
	if(position==-1)	return	text + tagStr;
	if(position==0){
	    if(text.length>1){
		    return		tagStr  + 	text.substring(position+1);
		}else{
		    return		tagStr;
		}	
	}else if(position==text.length-1){
	    if(text.length>1){
			return	text.substring(0,position) + tagStr;	
		}else{
		    return		tagStr;
		}	
	}
	//
	str1	=	text.substring(0,position);
	return	str1 + tagStr + text.substring(position+1);	
}

function MM_findObj(n, d) { //v4.01
  var p,i,x;  if(!d) d=document; if((p=n.indexOf("?"))>0&&parent.frames.length) {
    d=parent.frames[n.substring(p+1)].document; n=n.substring(0,p);}
